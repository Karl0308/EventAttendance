name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checks only. The GitHub Pages deployment this workflow used to run was removed with the SPA's
# login screen (Phase 6c): the admin app's home is IIS, same-origin with the API, and a public Pages
# URL serving an authenticated login form pointed at a `localhost` API is not something anyone wants
# indexed. `pages: write` and `id-token: write` went with it — a token scope nothing needs is a token
# scope worth not minting.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore EAMS.sln

      - name: Build
        run: dotnet build EAMS.sln --configuration Release --no-restore

      # EAMS.Tests splits into unit tests (pure logic, no database) and integration tests
      # (real SQL Server). The integration half starts its own SQL Server 2022 container via
      # Testcontainers — ubuntu-latest runners ship with Docker, so no service container,
      # no health-check polling, and no connection string in this file. The suite creates a
      # run-scoped database, applies the Section4Baseline migration, and drops it afterwards.
      #
      # CI=true is set by GitHub Actions. SqlServerFixture reads it and refuses to fall back
      # to a local SQL Server if Docker is unreachable: the behaviours these tests cover
      # (filtered unique indexes, NULL equality inside a unique index, unique-violation races)
      # exist only on real SQL Server, so a run that quietly tested something else — or
      # skipped — would report confidence it had not earned. A missing Docker fails the job.
      #
      # The first run on a fresh runner pulls mcr.microsoft.com/mssql/server:2022-latest
      # (~700 MB) and waits for the server to accept connections, so budget a couple of
      # minutes more than the build itself takes.
      - name: Test
        run: dotnet test EAMS.sln --configuration Release --no-build --verbosity normal

  web-admin:
    name: Web Admin (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `vitest run` — non-watch, and it exits non-zero on a failure, so nothing extra is needed to
      # make it a gate. It runs BEFORE the build on purpose: a type error and a broken assertion are
      # both worth knowing about, and the suite is the faster of the two to answer. Until this step
      # existed the tests in `web-admin/test/` ran for nobody but whoever remembered locally.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # docs/api/endpoints.md is generated from docs/api/openapi.json, so it can go stale with
      # nothing failing — the drift Phase 4e existed to end. EndpointIndexTests already fails the
      # backend job when a row is missing or names a route that no longer exists; this catches
      # what a coverage assertion structurally cannot — a change to how rows are *rendered*
      # (blurbs, the auth column) that was never regenerated. Runs here rather than in the backend
      # job because it needs Node and that job deliberately has none.
      #
      # No working-directory override: the script resolves paths from its own location, and this
      # job runs in web-admin.
      - name: Check API endpoint index is current
        run: node ../scripts/generate-endpoint-index.mjs

